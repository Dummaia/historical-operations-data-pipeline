services:
  postgres:
    image: postgres:16-alpine
    container_name: historical-operations-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: operations
    ports:
      - "5432:5432"
    volumes:
      - historical_operations_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d operations"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  historical_operations_pgdata:
