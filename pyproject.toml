[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-operations-data-pipeline"
version = "1.0.0"
description = "Traceable ETL pipeline for multi-sheet operational Excel snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Eduardo Maia", email = "maiae3381@gmail.com" },
]
keywords = [
  "data-engineering",
  "etl",
  "excel",
  "pandas",
  "parquet",
  "postgresql",
  "data-quality",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Office/Business",
]
dependencies = [
  "numpy>=1.26,<2.4",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.11",
]

[project.scripts]
historical-pipeline = "historical_operations_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/Dummaia/historical-operations-data-pipeline"
Repository = "https://github.com/Dummaia/historical-operations-data-pipeline"
Issues = "https://github.com/Dummaia/historical-operations-data-pipeline/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["historical_operations_pipeline"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "pragma: no cover",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
